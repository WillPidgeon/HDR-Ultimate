# hdrultra.help: the site, plus a Cloudflare Tunnel so it's reachable without opening any router ports.
# Put STATS_KEY and TUNNEL_TOKEN in a .env file next to this one (see .env.example), then: docker compose up -d --build

services:
  web:
    build: .
    restart: unless-stopped
    environment:
      STATS_KEY: ${STATS_KEY:-}
    volumes:
      - usage-data:/data
    # No ports published: only the tunnel reaches it. To try it on your network first,
    # uncomment the next two lines and open http://<this machine>:8080
    # ports:
    #   - "8080:8080"

  tunnel:
    image: cloudflare/cloudflared:2026.10.4
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Put the tunnel token from Cloudflare in .env}
    depends_on:
      - web

volumes:
  usage-data:
